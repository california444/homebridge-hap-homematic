name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint, build, test, audit (Node 24, latest Homebridge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      # Test against the newest Homebridge release, not only the locked one.
      - name: Install latest Homebridge
        run: npm install --no-save homebridge@latest

      - run: npx homebridge --version

      - run: npm run lint

      - run: npm run build

      - run: npm run coverage

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
