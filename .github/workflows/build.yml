name: Build

on:
  pull_request:
  workflow_dispatch:
  workflow_call: # from release.yml, before every release

permissions:
  contents: read

jobs:
  test:
    name: Lint, build, test, audit (Node 24, latest Homebridge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      # Test against the newest Homebridge release, not only the locked one.
      - name: Install latest Homebridge
        run: npm install --no-save homebridge@latest

      - run: npx homebridge --version

      - run: npm run lint

      - run: npm run build

      - run: npm run coverage

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  # Homebridge verification requires every supported Node LTS; the main
  # job above runs on 24, this one covers the others.
  test-node:
    name: Build and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '26']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - run: npm test
