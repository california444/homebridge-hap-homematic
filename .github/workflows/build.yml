name: Build

on:
  pull_request:
  workflow_dispatch:
  workflow_call: # from release.yml, before every release

permissions:
  contents: read

jobs:
  test:
    name: Lint, build, test, audit (Node 24, latest Homebridge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      # Test against the newest Homebridge release, not only the locked one.
      - name: Install latest Homebridge
        run: npm install --no-save homebridge@latest

      - run: npx homebridge --version

      - run: npm run lint

      - run: npm run build

      - run: npm run coverage

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
