# Release flow taken from california444/homebridge-doorbell-telegram-photo.
name: Release

on:
  push:
    branches: [main]
  # Re-publish an existing tag to npm, e.g. to the beta channel or after a
  # failed publish. Lives in this file because npm trusted publishing is bound
  # to a single workflow filename.
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish (e.g. v0.2.0)"
        required: true
        type: string
      channel:
        description: "npm dist-tag"
        required: true
        type: choice
        default: latest
        options:
          - latest
          - beta

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    if: github.event_name == 'push'
    uses: ./.github/workflows/build.yml

  release:
    needs: ci
    if: github.repository == 'california444/homebridge-hap-homematic'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Creates the tag and the GitHub release. It does not commit (main
      # requires PRs); CHANGELOG.md is maintained by hand in the PRs.
      # Nothing is published to npm here.
      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      # Empty unless semantic-release tagged this commit.
      - name: Detect new tag
        id: tag
        run: echo "tag=$(git tag --points-at HEAD | grep '^v' || true)" >> "$GITHUB_OUTPUT"

  npm:
    needs: release
    # always(): on workflow_dispatch the release job is skipped, which would
    # otherwise skip this job too.
    # Plan2 R2: no npm publish before the acceptance in phase 7 — the job only
    # runs once the repository variable NPM_PUBLISH is set to "true".
    if: >-
      always() &&
      github.repository == 'california444/homebridge-hap-homematic' &&
      vars.NPM_PUBLISH == 'true' &&
      (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (needs.release.result == 'success' && needs.release.outputs.tag != '')
      )
    # Waits for approval by a required reviewer of the "npm" environment.
    environment: npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishing (and provenance)

    env:
      TAG: ${{ inputs.tag || needs.release.outputs.tag }}
      CHANNEL: ${{ inputs.channel || 'latest' }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      # Node 24: npm trusted publishing needs npm >= 11.5.1.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          # npm download cache, keyed by package-lock.json; npm ci still
          # verifies every package against the lockfile hashes.
          cache: npm

      - name: Install dependencies
        run: npm ci

      # package.json on main only holds a placeholder; the tag is the source
      # of truth for the version.
      - name: Set version from tag
        run: |
          VERSION="${TAG#v}"
          if [ "$CHANNEL" = "latest" ] && echo "$VERSION" | grep -q -- '-'; then
            echo "Refusing to publish a prerelease version to latest: $VERSION" >&2
            exit 1
          fi
          npm version --no-git-tag-version --allow-same-version "$VERSION"

      # In the repo the entries of this release still sit under
      # "## Unreleased" (the next PR renames it). The package gets the
      # version heading; the repo is not touched.
      - name: Put the version into CHANGELOG.md
        run: |
          VERSION="${TAG#v}"
          DATE=$(git log -1 --format=%cs)
          if grep -q '^## Unreleased' CHANGELOG.md; then
            sed -i "0,/^## Unreleased.*/s//## ${VERSION} (${DATE})/" CHANGELOG.md
          fi
          sed -n '1,15p' CHANGELOG.md

      # prepack runs the build (dist/ and homebridge-ui/server.js are not in git).
      - name: Publish to npm
        run: npm publish --provenance --access public --tag "$CHANNEL"
